<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glowing blue gradient for V -->
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cyan gradient for center circle -->
    <radialGradient id="eyeGradient">
      <stop offset="0%" style="stop-color:#67E8F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </radialGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow for top bar -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Top horizontal glowing bar -->
  <line x1="80" y1="120" x2="320" y2="120" 
        stroke="#60A5FA" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#strongGlow)"
        opacity="0.9"/>
  
  <!-- Outer V shape (lighter, larger) -->
  <path d="M 90 130 L 200 340 L 310 130" 
        fill="none" 
        stroke="#3B82F6" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.3"/>
  
  <!-- Middle V shape (medium) -->
  <path d="M 100 135 L 200 325 L 300 135" 
        fill="none" 
        stroke="url(#vGradient)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"
        opacity="0.7"/>
  
  <!-- Inner V shape (brightest, sharpest) -->
  <path d="M 110 140 L 200 310 L 290 140" 
        fill="none" 
        stroke="#60A5FA" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Central verification eye -->
  <g filter="url(#glow)">
    <!-- Outer ring (white) -->
    <circle cx="200" cy="180" r="45" 
            fill="none" 
            stroke="white" 
            stroke-width="8"/>
    
    <!-- Middle ring (blue) -->
    <circle cx="200" cy="180" r="35" 
            fill="none" 
            stroke="#3B82F6" 
            stroke-width="6"/>
    
    <!-- Inner eye (cyan gradient) -->
    <circle cx="200" cy="180" r="22" 
            fill="url(#eyeGradient)"/>
    
    <!-- Eye highlight -->
    <circle cx="200" cy="180" r="22" 
            fill="white" 
            opacity="0.3"/>
    
    <!-- Pupil/core -->
    <circle cx="200" cy="180" r="10" 
            fill="#0891B2"/>
  </g>
  
  <!-- Scanning lines connecting to eye -->
  <g opacity="0.4">
    <line x1="120" y1="120" x2="175" y2="160" 
          stroke="#60A5FA" 
          stroke-width="2" 
          stroke-dasharray="4 4"/>
    <line x1="200" y1="120" x2="200" y2="135" 
          stroke="#60A5FA" 
          stroke-width="2" 
          stroke-dasharray="4 4"/>
    <line x1="280" y1="120" x2="225" y2="160" 
          stroke="#60A5FA" 
          stroke-width="2" 
          stroke-dasharray="4 4"/>
  </g>
  
  <!-- Corner accent marks (tech aesthetic) -->
  <g opacity="0.5" stroke="#60A5FA" stroke-width="2">
    <line x1="80" y1="115" x2="80" y2="125"/>
    <line x1="75" y1="120" x2="85" y2="120"/>
    
    <line x1="320" y1="115" x2="320" y2="125"/>
    <line x1="315" y1="120" x2="325" y2="120"/>
  </g>
</svg>
